name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore update-compatible signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          KEY_BASE64: ${{ secrets.MUH_TODO_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_BASE64" ]; then
            umask 077
            printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/muh-todo-debug.keystore"
            printf 'MUH_TODO_DEBUG_KEYSTORE=%s\n' "$RUNNER_TEMP/muh-todo-debug.keystore" >> "$GITHUB_ENV"
          else
            echo '::warning::Signing secret is missing. This test APK uses a fresh runner debug key and cannot update the previously installed app.'
          fi
      - name: Test, lint and build APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Prepare download
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/muh-todo.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/apk/muh-todo.apk" > "$RUNNER_TEMP/apk/signing-certificate.txt"
          cd "$RUNNER_TEMP/apk"
          sha256sum muh-todo.apk > SHA256SUMS
      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: muh-todo-${{ github.run_number }}
          path: ${{ runner.temp }}/apk/
          if-no-files-found: error
          retention-days: 90
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/muh-todo-debug.keystore"
